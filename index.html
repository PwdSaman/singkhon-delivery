<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singkhon Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <div class="overlay" onclick="toggleMenu()"></div>

        <nav class="side-menu">
            <div class="close-menu" onclick="toggleMenu()">✕</div>
            <div class="menu-title">บริการของเรา</div>
            
            <div class="menu-item" onclick="openLoginModal('customer')">
                <span class="icon">🛍️</span> สำหรับลูกค้า
            </div>
            
            <div class="menu-item" onclick="openLoginModal('merchant')">
                <span class="icon">🏪</span> สำหรับร้านค้า
            </div>
            
            <div class="menu-item" onclick="openLoginModal('rider')">
                <span class="icon">🛵</span> สำหรับไรเดอร์
            </div>
        </nav>

        <div class="modal-login">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <p id="modalSubTitle">Singkhon Delivery</p>
            </div>

            <div class="admin-notice" id="modalNotice">
                ⚠️ สำหรับบัญชีนี้ <br>
                ต้องติดต่อให้ <b>"แอดมิน"</b> เป็นผู้สมัครให้เท่านั้น
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                
                <div class="form-group" id="usernameGroup">
                    <label for="username" id="labelUsername">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้ของคุณ">
                </div>
                
                <div class="form-group" id="passwordGroup">
                    <label for="password">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
                </div>

                <button type="submit" class="btn-login" id="btnSubmitModal">
                    🔓 เข้าสู่ระบบ
                </button>

                <button type="button" class="btn-login btn-google" id="btnGoogleLogin" onclick="handleGoogleLogin()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> เข้าสู่ระบบด้วย Google
                </button>
                
                <button type="button" class="btn-cancel" onclick="closeLoginModal()">
                    ยกเลิก
                </button>
            </form>
        </div>

        <div class="header">
            <div class="menu-toggle" onclick="toggleMenu()">☰</div>
            <h1>Singkhon Delivery</h1>
        </div>

        <div class="main-content" id="guestView">
            <div class="app-logo">🛵</div>
            <h2>ยินดีต้อนรับ</h2>
            <p>ระบบจัดการสำหรับร้านค้า ไรเดอร์ และลูกค้า <br>กรุณากดปุ่มเมนู <span>☰</span> มุมซ้ายบนเพื่อเข้าสู่ระบบ</p>
        </div>

        <div class="main-content profile-content" id="userProfile" style="display: none;">
            <img id="profileImage" src="" alt="Profile Avatar">
            <h2 id="profileName">Name</h2>
            <p id="profileEmail">email@example.com</p>
            <br>
            <button class="btn-cancel btn-logout" onclick="handleLogout()">
                🚪 ออกจากระบบ
            </button>
        </div>
        
        <button class="btn-login" id="mainLoginBtn" onclick="openLoginModal('customer')">
            🛍️ เข้าสู่ระบบลูกค้า
        </button>
    </div>

<script type="module" src="firebase-auth.js"></script>
<script src="script.js"></script>

</body>
</html>
